Shamsy Electric Technologies = シャムシー電気技術
Seth Al-Muhtariq = セス・アル＝ムフタリク
Greetings, CEO Seth Al-Muhtariq of Shamsy Electric Technologies! Your company is among the few that stood in the wake of Old Earth's collapse. During that tumultuous time you've capitalized on your company's technological advantage to secure enough facilities and land for your people to survive. You've heard talk of other nations and corporations moving off-world - and the prestige and riches abound in those exoplanets. It was then that you decided to direct Shamsy Electric Technologies toward the stars. = Shamsy Electric TechnologiesのCEO、セス・アル・ムフタリク氏に挨拶申し上げます。貴社は、旧地球の崩壊という未曾有の事態を生き延びた数少ない企業の一つです。その激動の時代、貴社は自社の技術的優位性を活かし、人々が生存するために必要な施設と土地を確保しました。他国や他企業が地球外へと進出し、系外惑星で名声と富を築いているという噂も耳にしていたことでしょう。そして、貴社はShamsy Electric Technologiesの進路を「星々」へと向ける決断を下したのです。
Seth, this exoplanet is ripe for you to harvest and reign upon. Will you seize the prestige of conquering this unruly planet? Can you build a colony that stands the test of time? = セスよ、この系外惑星は、お前がその支配権を掌握し、君臨するのにうってつけの場所だ。この荒ぶる惑星を征服し、その栄光を我がものとするか？そして、時の試練に耐えうる入植地を築き上げることができるか？
